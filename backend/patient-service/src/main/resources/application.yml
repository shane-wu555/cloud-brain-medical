server:
  port: 8102

spring:
  application:
    name: patient-service
  datasource:
    url: ${PATIENT_DB_URL:jdbc:postgresql://localhost:5432/cloud_brain_medical?currentSchema=patient}
    username: ${DB_USERNAME:cloudbrain}
    password: ${DB_PASSWORD:cloudbrain}
  flyway:
    enabled: true
    schemas: patient
    default-schema: patient
    create-schemas: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

security:
  jwt:
    secret: ${JWT_SECRET:cloud-brain-medical-development-secret-change-me}
    issuer: ${JWT_ISSUER:cloud-brain-medical}

internal:
  api-key: ${INTERNAL_API_KEY:cloud-brain-medical-internal-development-key}
services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8101}
