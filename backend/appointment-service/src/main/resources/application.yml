server:
  port: 8104

spring:
  application:
    name: appointment-service
  datasource:
    url: ${APPOINTMENT_DB_URL:jdbc:postgresql://localhost:5432/cloud_brain_medical?currentSchema=appointment}
    username: ${DB_USERNAME:cloudbrain}
    password: ${DB_PASSWORD:cloudbrain}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: appointment
    default-schema: appointment
    create-schemas: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:cloud-brain-medical-development-secret-change-me}
    issuer: ${JWT_ISSUER:cloud-brain-medical}

internal:
  api-key: ${INTERNAL_API_KEY:cloud-brain-medical-internal-development-key}

services:
  cashier:
    base-url: ${CASHIER_SERVICE_URL:http://localhost:8113}
