server:
  port: 8113
spring:
  application:
    name: cashier-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: ${CASHIER_DB_URL:jdbc:postgresql://localhost:5432/cloud_brain_medical?currentSchema=cashier}
    username: ${DB_USERNAME:cloudbrain}
    password: ${DB_PASSWORD:cloudbrain}
    driver-class-name: org.postgresql.Driver
    hikari:
      keepalive-time: 60000
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 300000
      connection-timeout: 20000
  flyway:
    enabled: true
    schemas: cashier
    default-schema: cashier
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
security:
  jwt:
    secret: ${JWT_SECRET:cloud-brain-medical-development-secret-change-me}
    issuer: ${JWT_ISSUER:cloud-brain-medical}
internal:
  api-key: ${INTERNAL_API_KEY:cloud-brain-medical-internal-development-key}
payment:
  test-mode-enabled: ${PAYMENT_TEST_MODE_ENABLED:true}
  # Configure a phone-accessible public domain or tunnel URL here for cross-network QR scans.
  public-scan-base-url: https://gentle-hounds-grow.loca.lt
services:
  appointment:
    base-url: ${APPOINTMENT_SERVICE_URL:http://localhost:8104}
  medical-order:
    base-url: ${MEDICAL_ORDER_SERVICE_URL:http://localhost:8112}
  pharmacy:
    base-url: ${PHARMACY_SERVICE_URL:http://localhost:8107}
  patient:
    base-url: ${PATIENT_SERVICE_URL:http://localhost:8102}

audit:
  exchange: ${AUDIT_EXCHANGE:audit.events}
  routing-key: ${AUDIT_ROUTING_KEY:audit.event}
