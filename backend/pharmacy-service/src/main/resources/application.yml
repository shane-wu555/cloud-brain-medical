server:
  port: 8107

spring:
  application:
    name: pharmacy-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: ${PHARMACY_DB_URL:jdbc:postgresql://localhost:5432/cloud_brain_medical?currentSchema=pharmacy}
    username: ${DB_USERNAME:cloudbrain}
    password: ${DB_PASSWORD:cloudbrain}
    driver-class-name: org.postgresql.Driver
    hikari:
      keepalive-time: 60000
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 300000
      connection-timeout: 20000
  flyway:
    enabled: true
    schemas: pharmacy
    default-schema: pharmacy
    create-schemas: true
    locations: classpath:db/migration
security:
  jwt:
    secret: ${JWT_SECRET:cloud-brain-medical-development-secret-change-me}
    issuer: ${JWT_ISSUER:cloud-brain-medical}
internal:
  api-key: ${INTERNAL_API_KEY:cloud-brain-medical-internal-development-key}

services:
  patient:
    base-url: ${PATIENT_SERVICE_URL:http://localhost:8102}

inventory:
  ai-forecast:
    enabled: ${INVENTORY_AI_FORECAST_ENABLED:false}
    lookback-days: ${INVENTORY_AI_FORECAST_LOOKBACK_DAYS:90}
    lead-time-days: ${INVENTORY_AI_FORECAST_LEAD_TIME_DAYS:14}
    min-training-sample-days: ${INVENTORY_AI_FORECAST_MIN_TRAINING_SAMPLE_DAYS:30}
    refresh-ms: ${INVENTORY_AI_FORECAST_REFRESH_MS:86400000}
    initial-delay-ms: ${INVENTORY_AI_FORECAST_INITIAL_DELAY_MS:30000}

audit:
  exchange: ${AUDIT_EXCHANGE:audit.events}
  routing-key: ${AUDIT_ROUTING_KEY:audit.event}

search:
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:true}
    base-url: ${ELASTICSEARCH_BASE_URL:http://localhost:9200}
    drug-index: ${DRUG_ELASTICSEARCH_INDEX:cloudbrain-drugs}
