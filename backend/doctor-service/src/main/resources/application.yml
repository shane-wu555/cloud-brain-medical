server:
  port: 8103

spring:
  application:
    name: doctor-service
  datasource:
    url: ${DOCTOR_DB_URL:jdbc:postgresql://localhost:5432/cloud_brain_medical?currentSchema=doctor}
    username: ${DB_USERNAME:cloudbrain}
    password: ${DB_PASSWORD:cloudbrain}
    driver-class-name: org.postgresql.Driver
    hikari:
      keepalive-time: 60000
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 300000
      connection-timeout: 20000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  cache:
    type: redis
    redis:
      time-to-live: ${DOCTOR_CACHE_TTL:5m}
      cache-null-values: false
      key-prefix: "cloudbrain:doctor:"
      use-key-prefix: true
  flyway:
    enabled: true
    schemas: doctor
    default-schema: doctor
    create-schemas: true
    locations: classpath:db/migration

internal:
  api-key: ${INTERNAL_API_KEY:cloud-brain-medical-internal-development-key}
services:
  appointment:
    base-url: ${APPOINTMENT_SERVICE_URL:http://localhost:8104}
  ai:
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:18000}

scheduling:
  insight-enabled: ${SCHEDULING_INSIGHT_ENABLED:false}
  insight-refresh-ms: ${SCHEDULING_INSIGHT_REFRESH_MS:3600000}
  insight-initial-delay-ms: ${SCHEDULING_INSIGHT_INITIAL_DELAY_MS:5000}

security:
  jwt:
    secret: ${JWT_SECRET:cloud-brain-medical-development-secret-change-me}
    issuer: ${JWT_ISSUER:cloud-brain-medical}
