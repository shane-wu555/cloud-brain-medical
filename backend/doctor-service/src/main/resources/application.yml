server:
  port: 8103

spring:
  application:
    name: doctor-service
  datasource:
    url: ${DOCTOR_DB_URL:jdbc:postgresql://localhost:5432/cloud_brain_medical?currentSchema=doctor}
    username: ${DB_USERNAME:cloudbrain}
    password: ${DB_PASSWORD:cloudbrain}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: doctor
    default-schema: doctor
    create-schemas: true
    locations: classpath:db/migration

internal:
  api-key: ${INTERNAL_API_KEY:cloud-brain-medical-internal-development-key}

security:
  jwt:
    secret: ${JWT_SECRET:cloud-brain-medical-development-secret-change-me}
    issuer: ${JWT_ISSUER:cloud-brain-medical}

services:
  appointment:
    base-url: ${APPOINTMENT_SERVICE_URL:http://localhost:8104}
