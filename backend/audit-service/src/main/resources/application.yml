server:
  port: 8110

spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/cloud_brain_medical?currentSchema=audit}
    username: ${DB_USERNAME:cloudbrain}
    password: ${DB_PASSWORD:cloudbrain}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: audit
    default-schema: audit
    create-schemas: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:cloud-brain-medical-development-secret-change-me}
    issuer: ${JWT_ISSUER:cloud-brain-medical}

internal:
  api-key: ${INTERNAL_API_KEY:cloud-brain-medical-internal-development-key}
