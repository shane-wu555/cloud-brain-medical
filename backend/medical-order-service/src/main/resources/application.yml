server:
  port: 8112

spring:
  application:
    name: medical-order-service
  datasource:
    url: ${MEDICAL_ORDER_DB_URL:jdbc:postgresql://localhost:5432/cloud_brain_medical?currentSchema=medical_order}
    username: ${DB_USERNAME:cloudbrain}
    password: ${DB_PASSWORD:cloudbrain}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: medical_order
    default-schema: medical_order
    create-schemas: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:cloud-brain-medical-development-secret-change-me}
    issuer: ${JWT_ISSUER:cloud-brain-medical}
