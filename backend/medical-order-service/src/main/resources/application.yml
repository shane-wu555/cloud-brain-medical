server:
  port: 8112
  tomcat:
    max-http-form-post-size: ${MEDICAL_ORDER_MAX_FORM_POST_SIZE:2147483647}
    max-swallow-size: ${MEDICAL_ORDER_MAX_SWALLOW_SIZE:-1}

spring:
  application:
    name: medical-order-service
  servlet:
    multipart:
      max-file-size: ${MEDICAL_ORDER_MAX_FILE_SIZE:2048MB}
      max-request-size: ${MEDICAL_ORDER_MAX_REQUEST_SIZE:2048MB}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: ${MEDICAL_ORDER_DB_URL:jdbc:postgresql://localhost:5432/cloud_brain_medical?currentSchema=medical_order}
    username: ${DB_USERNAME:cloudbrain}
    password: ${DB_PASSWORD:cloudbrain}
    driver-class-name: org.postgresql.Driver
    hikari:
      keepalive-time: 60000
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 300000
      connection-timeout: 20000
  flyway:
    enabled: true
    schemas: medical_order
    default-schema: medical_order
    create-schemas: true
    locations: classpath:db/migration
    validate-on-migrate: false

security:
  jwt:
    secret: ${JWT_SECRET:cloud-brain-medical-development-secret-change-me}
    issuer: ${JWT_ISSUER:cloud-brain-medical}

internal:
  api-key: ${INTERNAL_API_KEY:cloud-brain-medical-internal-development-key}
services:
  ai:
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
  appointment:
    base-url: ${APPOINTMENT_SERVICE_URL:http://localhost:8104}
  medical-record:
    base-url: ${MEDICAL_RECORD_SERVICE_URL:http://localhost:8105}
  patient:
    base-url: ${PATIENT_SERVICE_URL:http://localhost:8102}
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_MEDICAL_BUCKET:medical-imaging}

audit:
  exchange: ${AUDIT_EXCHANGE:audit.events}
  routing-key: ${AUDIT_ROUTING_KEY:audit.event}
