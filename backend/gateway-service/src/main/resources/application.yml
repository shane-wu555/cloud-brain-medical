server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8101
          predicates:
            - Path=/api/auth/**
        - id: patient-service
          uri: http://localhost:8102
          predicates:
            - Path=/api/patients/**
        - id: doctor-service
          uri: http://localhost:8103
          predicates:
            - Path=/api/departments/**,/api/doctors/**,/api/schedules/**,/api/catalog/**
        - id: appointment-service
          uri: http://localhost:8104
          predicates:
            - Path=/api/appointments/**,/api/dashboard/**
        - id: cashier-service
          uri: http://localhost:8113
          predicates:
            - Path=/api/payments/**,/api/refunds/**
        - id: pharmacy-service
          uri: http://localhost:8107
          predicates:
            - Path=/api/drugs/**,/api/prescriptions/**,/api/drug-returns/**
        - id: medical-record-service
          uri: http://localhost:8105
          predicates:
            - Path=/api/medical-records/**
        - id: medical-order-service
          uri: http://localhost:8112
          predicates:
            - Path=/api/medical-orders/**
        - id: ai-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/ai/**

security:
  jwt:
    secret: ${JWT_SECRET:cloud-brain-medical-development-secret-change-me}
    issuer: ${JWT_ISSUER:cloud-brain-medical}
