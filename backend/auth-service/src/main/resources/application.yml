server:
  port: 8101

internal:
  api-key: ${INTERNAL_API_KEY:cloud-brain-internal-development-key}

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/cloud_brain_medical?currentSchema=auth}
    username: ${DB_USERNAME:cloudbrain}
    password: ${DB_PASSWORD:cloudbrain}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: auth
    default-schema: auth
    create-schemas: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:cloud-brain-medical-development-secret-change-me}
    issuer: ${JWT_ISSUER:cloud-brain-medical}
    ttl-seconds: ${JWT_TTL_SECONDS:7200}
  verification-code:
    ttl-seconds: ${VERIFICATION_CODE_TTL_SECONDS:300}
    expose-in-response: ${EXPOSE_VERIFICATION_CODE:true}
